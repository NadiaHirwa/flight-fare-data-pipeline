<svg width="100%" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>Flight Fare Data Pipeline — System Architecture</title>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="95" width="820" height="410" rx="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="58" y="118" font-size="13" fill="#6b7280" font-weight="600">Docker Compose environment</text>

  <rect x="350" y="20" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.3"/>
  <text x="450" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Flight_Price_Dataset_of</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">_Bangladesh.csv</text>

  <line x1="450" y1="70" x2="450" y2="128" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="230" y="132" width="440" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="450" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Apache Airflow 3 (LocalExecutor)</text>
  <text x="450" y="170" text-anchor="middle" font-size="11.5" fill="#1e40af">scheduler + dag-processor + api-server</text>
  <text x="450" y="185" text-anchor="middle" font-size="11.5" fill="#1e40af">orchestrates: ingest → validate → transform → KPIs → quality checks</text>

  <line x1="358" y1="192" x2="222" y2="238" stroke="#374151" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="240" y="212" font-size="10.5" fill="#374151">ingest, validate,</text>
  <text x="240" y="224" font-size="10.5" fill="#374151">read for reconciliation</text>

  <line x1="542" y1="192" x2="678" y2="238" stroke="#374151" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="590" y="212" font-size="10.5" fill="#374151">compute KPIs,</text>
  <text x="590" y="224" font-size="10.5" fill="#374151">run quality checks</text>

  <rect x="540" y="196" width="280" height="26" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="680" y="213" text-anchor="middle" font-size="10" fill="#713f12">same instance also hosts: airflow metadata DB (role: airflow, ADR-002)</text>

  <rect x="80" y="240" width="280" height="150" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
  <text x="220" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064e3b">MySQL — Staging Layer</text>
  <text x="220" y="280" text-anchor="middle" font-size="11" fill="#065f46">role: staging_loader</text>
  <text x="220" y="304" text-anchor="middle" font-size="12" fill="#064e3b">raw_flights</text>
  <text x="220" y="324" text-anchor="middle" font-size="12" fill="#064e3b">quarantine</text>
  <text x="220" y="344" text-anchor="middle" font-size="12" fill="#064e3b">pipeline_runs</text>
  <text x="220" y="372" text-anchor="middle" font-size="10.5" fill="#065f46" font-style="italic">raw landing zone — loose types,</text>
  <text x="220" y="385" text-anchor="middle" font-size="10.5" fill="#065f46" font-style="italic">mirrors source structure</text>

  <rect x="540" y="240" width="280" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="680" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95">PostgreSQL — Analytics Layer</text>
  <text x="680" y="280" text-anchor="middle" font-size="11" fill="#5b21b6">role: analytics_writer</text>
  <text x="680" y="304" text-anchor="middle" font-size="12" fill="#4c1d95">flight_fare_quotes</text>
  <text x="680" y="322" text-anchor="middle" font-size="11" fill="#4c1d95">kpi_avg_fare_by_airline</text>
  <text x="680" y="338" text-anchor="middle" font-size="11" fill="#4c1d95">kpi_flight_offer_count_by_airline</text>
  <text x="680" y="354" text-anchor="middle" font-size="11" fill="#4c1d95">kpi_top_routes</text>
  <text x="680" y="370" text-anchor="middle" font-size="11" fill="#4c1d95">kpi_seasonal_fare_variation</text>

  <line x1="360" y1="315" x2="540" y2="315" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#374151">transform_and_load_fact</text>
  <text x="450" y="330" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">(one Postgres-side transaction —</text>
  <text x="450" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">MySQL reads are separate, not distributed)</text>

  <rect x="540" y="420" width="280" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="680" y="450" text-anchor="middle" font-size="12" fill="#374151">pgAdmin (inspection, containerized)</text>
  <line x1="680" y1="390" x2="680" y2="418" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="220" y1="390" x2="220" y2="530" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="80" y="540" width="280" height="50" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="220" y="562" text-anchor="middle" font-size="11.5" fill="#4b5563">MySQL client — make mysql-shell</text>
  <text x="220" y="578" text-anchor="middle" font-size="9.5" fill="#6b7280" font-style="italic">(runs on host, not a compose service)</text>

  <text x="60" y="630" font-size="11.5" fill="#374151" font-weight="600">Key design points:</text>
  <text x="60" y="650" font-size="11" fill="#4b5563">• Two databases, opposite guarantees: MySQL permissive (raw landing), PostgreSQL strict (NUMERIC, NOT NULL, CHECK, UNIQUE)</text>
  <text x="60" y="668" font-size="11" fill="#4b5563">• Rejected rows are never dropped — quarantined in MySQL with full traceability, never loaded into PostgreSQL</text>
  <text x="60" y="686" font-size="11" fill="#4b5563">• Each role owns only its own layer (least privilege): staging_loader, analytics_writer, and Airflow's own metadata role — never superuser</text>
</svg>
