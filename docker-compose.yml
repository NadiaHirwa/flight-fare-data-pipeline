x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-fab pytest
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    # [webserver] secret_key moved to [api] in Airflow 3; the old name still
    # works but warns on every command.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    # Signs the JWT a running task presents to the Execution API. Unset, each
    # process generates its own, so the scheduler's token is rejected by the
    # api-server with "Invalid auth token" and every task fails at Pre Execute.
    # Reuses the same secret so .env needs no new key.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow 3: a running task calls back to the Execution API rather than
    # touching the metadata DB directly. The default is localhost:8080, which
    # inside the scheduler container is nothing — tasks die at "Pre Execute"
    # with [Errno 111] Connection refused. The api-server is a separate
    # container, so it has to be named explicitly.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./include:/opt/airflow/include
    - ./tests:/opt/airflow/tests
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3308:3306"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      # Only this service sees the database credentials. The scheduler and
      # api-server reach MySQL and PostgreSQL through the Airflow Connections
      # created below, per the Security section of docs/MASTER_PLAN.md — they
      # deliberately do not get these in their environment.
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Hirwa \
          --lastname Nadia \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true
        # Connections the pipeline resolves by conn_id (src/shared/connections.py).
        #
        # Deleted before being added, rather than `add ... || true` alone.
        # `connections add` exits 1 on an existing conn_id, so the guard makes a
        # restart safe — but it also means an edited password in .env would be
        # swallowed by that guard and the stale Connection would quietly keep
        # working until it didn't. Deleting first makes .env the single source
        # of truth on every `docker compose up`.
        #
        # `connections delete` also exits 1 when the conn_id is absent, which is
        # the normal first-boot case, hence its own guard.
        #
        # Flags verified against the CLI in this exact image (Airflow 3.3.1);
        # conn_id is positional, everything else is --conn-*.
        airflow connections delete mysql_staging 2>/dev/null || true
        airflow connections add mysql_staging \
          --conn-type mysql \
          --conn-host mysql \
          --conn-port 3306 \
          --conn-login "${MYSQL_USER}" \
          --conn-password "${MYSQL_PASSWORD}" \
          --conn-schema "${MYSQL_DATABASE}" || true
        airflow connections delete postgres_analytics 2>/dev/null || true
        airflow connections add postgres_analytics \
          --conn-type postgres \
          --conn-host postgres \
          --conn-port 5432 \
          --conn-login "${ANALYTICS_DB_USER}" \
          --conn-password "${ANALYTICS_DB_PASSWORD}" \
          --conn-schema "${ANALYTICS_DB_NAME}" || true

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3 split DAG parsing out of the scheduler into its own component.
  # Without it nothing ever reaches the DagModel: `airflow dags list` returns
  # "No data found" and triggering fails with DagNotFound, even though the DAG
  # file is present and parses cleanly.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mysql-data:
  airflow-logs:
  pgadmin-data: